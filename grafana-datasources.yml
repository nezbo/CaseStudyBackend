apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: "${PROMETHEUS_ENDPOINT}"

  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: "${JAEGER_ENDPOINT}"

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: "${LOKI_ENDPOINT}"